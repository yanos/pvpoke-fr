name: Generate Rankings Page

on:
  schedule:
    - cron: '0 8 * * *'   # every day at 8am UTC
  workflow_dispatch:       # also allow manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync pvpoke battle engine + data
        run: python sync_engine.py

      - name: Generate rankings + battle pages
        run: python pvpoke_fr.py

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          mv rankings_fr.html _site/index.html
          mv battle_fr.html _site/battle_fr.html
          cp battle_driver.js gamemaster_shim.js _site/
          cp -r vendor _site/vendor

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
