name: Generate Rankings Page

on:
  schedule:
    - cron: '0 8 * * *'   # every day at 8am UTC
  workflow_dispatch:       # also allow manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # generate.sh's build_baselines.js step needs Node. It degrades to keeping the committed
      # baselines when Node is absent, so pin it here to make sure CI actually regenerates them
      # against the freshly-synced engine/rankings rather than silently shipping stale ones.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Configure git identity
        # Needed for the name-cache commit made in the next step. generate.sh (further below)
        # never commits anything itself, so this identity isn't needed for it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Refresh French name cache
        # Standalone and run first, before sync_engine.py/generate.sh: this is the slow,
        # PokeAPI-rate-limited step (30-45+ minutes on a cold cache), so get it committed via
        # its own PR before spending any time regenerating the site pages. generate.sh's own
        # pvpoke_fr.py run reuses whatever's left in name_cache.json, so a warm cache also makes
        # the rest of the pipeline fast.
        id: name_cache
        run: |
          python3 update_name_cache.py
          if [ -n "$(git status --porcelain -- vendor/pvpoke/data/name_cache.json)" ]; then
            git add -- vendor/pvpoke/data/name_cache.json
            git commit -m "chore: update French name cache" -- vendor/pvpoke/data/name_cache.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR for name cache update
        # Push the commit above to a dedicated bot branch instead of main directly, since main
        # may have branch protection, and force-push that branch so it always sits on top of the
        # latest main rather than accumulating stale commits day over day. Force-pushing here
        # only ever touches this bot-owned branch, never main. If a PR is already open for it,
        # the force push alone updates its diff — GitHub tracks PRs by branch head, so no further
        # gh call is needed in that case.
        if: steps.name_cache.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/name-cache-update"
          git push --force origin "HEAD:refs/heads/$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --title "chore: update French name cache" \
              --body "Automated update of \`vendor/pvpoke/data/name_cache.json\` from the daily rankings workflow: newly confirmed French Pokemon/move name lookups from PokeAPI." \
              --head "$branch" --base main
          fi

      - name: Generate rankings + battle pages
        run: ./generate.sh

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp rankings_fr.html _site/index.html
          cp rankings_fr.html _site/rankings_fr.html
          mv battle_fr.html _site/battle_fr.html
          cp battle_driver.js battle_worker.js gamemaster_shim.js _site/
          cp -r vendor _site/vendor

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
