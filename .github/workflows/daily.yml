name: Generate Rankings Page

on:
  schedule:
    - cron: '0 8 * * *'   # every day at 8am UTC
  workflow_dispatch:       # also allow manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to commit the generated file back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate rankings page
        run: python pvpoke_fr.py

      - name: Move output to docs/
        run: |
          mkdir -p docs
          mv rankings_fr.html docs/index.html

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet \
            || git commit -m "chore: update rankings $(date -u +%Y-%m-%d)"
          git push
